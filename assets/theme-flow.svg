<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Theme pipeline" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1033"/><stop offset="1" stop-color="#120a26"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b7bb5"/></marker>
    <clipPath id="clip"><rect width="1200" height="420" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <text x="40" y="42" font-size="13" font-weight="700" letter-spacing="2" fill="#f9a8d4">PER-COMPANY THEMING · ONE NETWORK CALL PER LOGIN</text>
    <text x="40" y="62" font-size="12" fill="#a79bc9">Every page after login paints from the local cache — no theme request on navigation or refresh.</text>

    <g stroke="#6b5b95" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M215 140H265"/><path d="M455 140H505"/><path d="M695 140H745"/><path d="M935 140H985"/>
      <path d="M1090 175V245"/><path d="M1090 295V345"/>
    </g>
    <path d="M985 380H300" stroke="#6b5b95" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#a)"/>

    <circle r="6" fill="#f472b6"><animateMotion dur="7s" repeatCount="indefinite" path="M120 140H1090V380H300"/></circle>
    <circle r="6" fill="#a78bfa"><animateMotion dur="7s" begin="3.5s" repeatCount="indefinite" path="M120 140H1090V380H300"/></circle>

    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="40" y="105" width="175" height="70" rx="12" fill="#2a1450" stroke="#f9a8d4"/>
      <text x="127" y="136" fill="#fce7f3">User logs in</text><text x="127" y="157" font-size="12" font-weight="400" fill="#f9a8d4">investor or staff</text>

      <rect x="265" y="105" width="190" height="70" rx="12" fill="#2a1450" stroke="#e879f9"/>
      <text x="360" y="136" fill="#fae8ff">GET /themes/active</text><text x="360" y="157" font-size="12" font-weight="400" fill="#e879f9">once, before redirect</text>

      <rect x="505" y="105" width="190" height="70" rx="12" fill="#2a1450" stroke="#a78bfa"/>
      <text x="600" y="136" fill="#ede9fe">localStorage cache</text><text x="600" y="157" font-size="12" font-weight="400" fill="#c4b5fd">vars + theme id + name</text>

      <rect x="745" y="105" width="190" height="70" rx="12" fill="#2a1450" stroke="#818cf8"/>
      <text x="840" y="136" fill="#e0e7ff">Inline script paints</text><text x="840" y="157" font-size="12" font-weight="400" fill="#a5b4fc">before hydration (no flash)</text>

      <rect x="985" y="105" width="190" height="70" rx="12" fill="#3b0f3f" stroke="#f472b6" stroke-width="2.5"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></rect>
      <text x="1080" y="136" fill="#fce7f3">--fin-* variables</text><text x="1080" y="157" font-size="12" font-weight="400" fill="#f9a8d4">on &lt;html&gt;</text>

      <rect x="985" y="245" width="190" height="50" rx="12" fill="#2a1450" stroke="#e879f9"/>
      <text x="1080" y="275" font-size="14" fill="#fae8ff">Settings → Appearance</text>

      <rect x="985" y="345" width="190" height="60" rx="12" fill="#2a1450" stroke="#f9a8d4"/>
      <text x="1080" y="375" font-size="14" fill="#fce7f3">Save / activate</text>
      <text x="1080" y="395" font-size="12" font-weight="400" fill="#f9a8d4">cache updated instantly</text>

      <rect x="40" y="345" width="260" height="60" rx="12" fill="#1f0f2e" stroke="#6b5b95" stroke-dasharray="4 4"/>
      <text x="170" y="372" font-size="14" fill="#d8b4fe">Logout clears the cache</text>
      <text x="170" y="391" font-size="12" font-weight="400" fill="#a79bc9">next company never sees a stale theme</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="#4c3a7a"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
