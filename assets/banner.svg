<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="FinIQ banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1038"/><stop offset="0.55" stop-color="#2e1065"/><stop offset="1" stop-color="#701a75"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9a8d4"/><stop offset="0.5" stop-color="#e879f9"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c4b5fd" stroke-opacity="0.08"/></pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- AUM-style growth curve, draws itself -->
    <path d="M0 270 C120 262 170 240 260 232 S420 205 520 190 S700 150 800 128 S1010 90 1200 52 V300 H0 Z" fill="url(#area)"/>
    <path d="M0 270 C120 262 170 240 260 232 S420 205 520 190 S700 150 800 128 S1010 90 1200 52" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" stroke-dasharray="1500" stroke-dashoffset="1500">
      <animate attributeName="stroke-dashoffset" from="1500" to="0" dur="4s" fill="freeze" repeatCount="1"/>
    </path>
    <circle r="6" fill="#fff"><animateMotion dur="6s" repeatCount="indefinite" path="M0 270 C120 262 170 240 260 232 S420 205 520 190 S700 150 800 128 S1010 90 1200 52"/></circle>

    <!-- bars -->
    <g fill="#c4b5fd" fill-opacity="0.18">
      <rect x="880" y="215" width="26" height="85"><animate attributeName="height" values="60;95;60" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="240;205;240" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="930" y="195" width="26" height="105"><animate attributeName="height" values="105;75;105" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="195;225;195" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="980" y="170" width="26" height="130"><animate attributeName="height" values="110;140;110" dur="4.5s" repeatCount="indefinite"/><animate attributeName="y" values="190;160;190" dur="4.5s" repeatCount="indefinite"/></rect>
      <rect x="1030" y="150" width="26" height="150"><animate attributeName="height" values="150;120;150" dur="5.5s" repeatCount="indefinite"/><animate attributeName="y" values="150;180;150" dur="5.5s" repeatCount="indefinite"/></rect>
    </g>

    <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="100" font-weight="800" letter-spacing="2" fill="url(#title)">FinIQ
      <animate attributeName="opacity" values="0.93;1;0.93" dur="4s" repeatCount="indefinite"/></text>
    <text x="600" y="182" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#e9d5ff" letter-spacing="3">WEALTHTECH PLATFORM FOR MUTUAL FUND DISTRIBUTORS</text>
    <g font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="14" font-weight="700" text-anchor="middle">
      <rect x="378" y="212" width="130" height="32" rx="16" fill="#1e1038" stroke="#f9a8d4" stroke-opacity="0.7"/><text x="443" y="233" fill="#f9a8d4">ADMIN</text>
      <rect x="524" y="212" width="152" height="32" rx="16" fill="#1e1038" stroke="#e879f9" stroke-opacity="0.7"/><text x="600" y="233" fill="#e879f9">DISTRIBUTOR</text>
      <rect x="692" y="212" width="130" height="32" rx="16" fill="#1e1038" stroke="#a78bfa" stroke-opacity="0.7"/><text x="757" y="233" fill="#a78bfa">INVESTOR</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#a855f7" stroke-opacity="0.45"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
